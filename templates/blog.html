{% extends "zola-grayscale/templates/index.html" %}


{% block extra_head %}
<link rel="stylesheet" type="text/css" href="{{ get_url(path="css/custom.css") }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
{% endblock extra_head %}


{% block masthead_title %}{{ page.title }}{% endblock masthead_title %}

{% block content %}
<section class="projects-section bg-light" id="{% block projects_id %}projects{% endblock projects_id %}">
    <div class="container px-4 px-lg-5">
        <div class="row gx-0 mb-4 mb-lg-5 align-items-center">
            {{ page.content | safe }}
        </div>
    </div>
</section>  
{% endblock content %}


{% block about_image %}
<img class="img-fluid" src="{{ get_url(path="assets/img/quantica.jpg") }}" alt="quântica" />
{% endblock about_image %}
